# agent-pod user configuration.
# Run-level settings live in the `default` profile, which is active unless a
# named profile is passed to `ap run`/`ap shell` (e.g. `ap run fixes`).
# Build-level overrides (ephemeral, extra_packages, flake gates) live at the
# top level and apply to whichever agent is run. All keys are optional.
profile: default
profiles:
  default:
    agent: pi
  claude:
    agent: claude
    # claude's Linux recorder: bundled native module, falling back to arecord
    # (alsa-utils) or rec (sox). Neither is in the base image.
    extra_packages:
      - alsa-utils
      - sox
    files:
      # claude's settings.json hooks reference $HOME/dotfiles/... paths.
      - source: ~/dotfiles
        name: dotfiles
        target: /root/dotfiles
        permissions: ro
        optional: true
        description: host dotfiles (referenced by claude hook commands)
      # Raw /dev/snd capture inside a container records silence (the host's
      # PipeWire owns the codec), so record through the host audio server: its
      # socket is at the path PULSE_SERVER names in the claude image.
      - source: $XDG_RUNTIME_DIR/pulse
        name: runtime-pulse
        target: /run/user/0/pulse
        permissions: rw
        optional: true
        description: host PipeWire/PulseAudio socket (microphone)
      - source: ~/.config/pulse
        name: config-pulse
        target: /root/.config/pulse
        permissions: ro
        optional: true
        description: pulse client config and cookie
  skills:
    agent: pi
    files:
      - source: ~/.agent/skills
        name: skills
        permissions: rw
        description: host skills dir (read/write; writes flow back to host)
  insights:
    agent: pi
    files:
      - source: ~/.pi/agent/insights-reports
        name: insights-reports
        permissions: rw
        description: insights reports (host passthrough; /insights writes here so the HTML lands on the host)
ephemeral: true
extra_packages:
- uv
- ty
- ruff
- gnumake
- ripgrep
- jq
- findutils

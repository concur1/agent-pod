# Claude Code agent — content comes from the flake; runtime from agent-pod.
flake:
  dir: config/agents/claude        # dir with flake.nix + flake.lock

image_tag: localhost/claude-sandbox:latest
container_name: claude-sandbox-instance
container_home: /root/.claude
# Every file/dir supplied to the sandbox lives in `files`; mount order follows
# list order.
files:
  # Claude's whole config dir (CLAUDE_CONFIG_DIR, set in the image, so it also
  # holds .claude.json): login, onboarding, trust and settings persist across
  # sessions in the agent's shared state dir, and claude's atomic writes work
  # because these files live in a mounted dir rather than being bound one by
  # one. Listed first so the mounts below nest on top of it.
  - name: config
    target: /root/.claude
    type: dir
    permissions: rw
    shared: true
    secret: true
    description: "claude config, settings and login (shared across sessions)"
  # Your global skills dir (~/.agent/skills/<name>/SKILL.md) mounted read-only.
  - source: ~/.agent/skills
    name: skills
    permissions: ro
    optional: true
    description: "Your global skills dir (host passthrough)"
  # Generated global instruction file (CLAUDE.md), always mounted at the
  # container home so it loads regardless of where the repo's own CLAUDE.md
  # sits.
  - source: builtin:instructions
    name: CLAUDE.md
    permissions: ro
    description: "Generated global agent instructions"
  # Host settings seeded into the shared config dir on first run (default
  # model, permissions, ...); afterwards the sandbox's copy is its own, so
  # `/model` etc. persist. Delete it from `.shared/config/` to re-seed.
  - source: ~/.claude/settings.json
    name: config/settings.json
    target: /root/.claude/settings.json
    permissions: rw
    seed: true
    shared: true
    description: "claude settings (seeded from host)"
  # Writable state for claude's own runtime.
  - name: history
    permissions: rw
    description: "claude history (state)"
  # Claude Code session transcripts: ~/.claude/projects/<encoded-cwd>/<session>.jsonl.
  - name: projects
    permissions: rw
    description: "claude session transcripts (state)"
tmpfs_mounts:
  /root/.cache: rw,exec,size=512m
  /tmp: rw,exec,size=512m
# No env vars are forwarded by default (e.g. ANTHROPIC_API_KEY); opt in with
# `passthrough_envs` in your own config if you need them.

[project]
name = "agent-pod"
version = "0.1.0"
description = "Fast, isolated container sandboxes for AI coding agents using Podman CLI."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "polars>=1.0",
]

[project.scripts]
ap = "agent_pod:main"
agent-pod = "agent_pod:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_pod"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.9.0",
    "ty>=0.0.80",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF"]

[tool.ty.environment]
python-version = "3.11"

[tool.ty.src]
include = ["src"]

